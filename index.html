<!DOCTYPE html>
<html>
<head>
    <title>Tasavar Designs</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 40px;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            color: black;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        section {
            padding: 30px;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #222;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card h3 {
            margin: 10px;
        }

        .btn {
            display: inline-block;
            background: #ff4e50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin: 10px;
        }

        .btn:hover {
            background: #f9d423;
            color: black;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tasavar T-Shirt Designs 👕</h1>
        <p>Creative | Trendy | Unique</p>
    </header>

    <section>
        <h2>My Collection</h2>

        <div class="gallery">

            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Design 1">
                <h3>Street Style</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Design 2">
                <h3>Minimal Art</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Design 3">
                <h3>Typography Tee</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Design 4">
                <h3>Graphic Print</h3>
            </div>

        </div>

        <!-- LINKS -->
        <a href="https://instagram.com/yourusername" target="_blank" class="btn">Instagram</a>
        
        <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="btn">WhatsApp Order</a>

    </section>

    <footer>
        <p>© 2026 Tasavar Designs | Follow for more 🔥</p>
    </footer>

</body>
</html>
